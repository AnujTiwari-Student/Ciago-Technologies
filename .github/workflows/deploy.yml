name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - staging

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Doppler CLI
        run: |
          curl -sLf --retry 3 --tlsv1.2 --proto "=https" "https://cli.doppler.com/install.sh" | sudo sh

      - name: Set worker name (production)
        if: github.ref_name == 'main'
        run: sed -i "1s/.*/name = \"ciagotech-production\"/" wrangler.toml

      - name: Set worker name (staging)
        if: github.ref_name != 'main'
        run: sed -i "1s/.*/name = \"ciagotech-staging\"/" wrangler.toml

      - name: Build (production)
        if: github.ref_name == 'main'
        run: doppler run -- npm run build
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}

      - name: Build (staging)
        if: github.ref_name != 'main'
        run: doppler run -- npm run build
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STG }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
