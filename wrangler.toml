name = "ciagotech-staging"
main = ".output/server/index.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Account configuration - fill in your Cloudflare account ID
# Get from: https://dash.cloudflare.com/ → Workers & Pages → Account ID
account_id = "843c692336b003ca79f308d59b05660a"

# Build configuration
[build]
command = "npm run build"

# Observability configuration
[observability]
enabled = true

# Environments are managed via separate deploys with different wrangler.toml names
# Production: name = "ciagotech-staging", routes ciagotech.com/*
# Staging: name = "ciagotech-staging" (current), workers_dev = true
# See .production/DEPLOYMENT_START_GUIDE.md for deployment instructions

# D1 Database binding (uncomment when ready)
# [[d1_databases]]
# binding = "DB"
# database_name = "ciagotech-db"
# database_id = "" # Get from: wrangler d1 create ciagotech-db
# preview_database_id = "" # Get from: wrangler d1 create ciagotech-db-preview

# KV namespace bindings (uncomment when ready)
# [[kv_namespaces]]
# binding = "KV"
# id = "" # Get from: wrangler kv:namespace create "KV" --preview false
# preview_id = "" # Get from: wrangler kv:namespace create "KV" --preview true

# R2 bucket bindings (uncomment when ready)
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "ciagotech-assets"
# preview_bucket_name = "ciagotech-assets-preview"

# Analytics Engine binding (uncomment when ready)
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"

# Browser Rendering API (uncomment when ready)
# [browser]
# binding = "BROWSER"

# AI binding (uncomment when ready)
# [ai]
# binding = "AI"

# Durable Objects (uncomment when ready)
# [[durable_objects.bindings]]
# name = "DO"
# class_name = "DurableObjectExample"
# script_name = "ciagotech"

# Queue bindings (uncomment when ready)
# [[queues.producers]]
# binding = "QUEUE"
# queue = "ciagotech-queue"

# [[queues.consumers]]
# queue = "ciagotech-queue"
# max_batch_size = 10
# max_batch_timeout = 30
